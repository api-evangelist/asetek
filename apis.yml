name: Asetek
description: 'Asetek designs and builds liquid cooling and thermal-management technology. Founded in 2000
  and headquartered in Aalborg, Denmark, the company pioneered all-in-one (AIO) closed-loop liquid coolers
  for enthusiast and gaming PCs and supplies OEM cooling to major PC and workstation brands. Its data-center
  and high-performance-computing business delivers direct-to-chip liquid cooling for servers and racks, and
  its Asetek SimSports division makes premium sim-racing hardware such as force-feedback wheelbases and load-cell
  pedals. Asetek is a hardware manufacturer and does not currently publish a public developer API, developer
  portal, or SDKs; this profile was surfaced as a portfolio company of Northzone and enriched with what is
  publicly verifiable (domain-security posture).'
